; PlatformIO Project Configuration for Device 2: Automation Hub
; Tech IoT Warriors — IoT Projects Lab

[platformio]
src_dir = .
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
    -D ARDUINOJSON_USE_LONG_LONG=0

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
