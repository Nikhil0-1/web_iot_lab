<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unit Tests — Project 02 Gas Leakage Detector</title>
  <link rel="stylesheet" href="../../../shared/css/design-system.css">
  <style>
    body { padding: 30px; }
    .test-suite { max-width: 800px; margin: 0 auto; }
    .test-result { padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 8px; font-family: var(--font-mono); font-size: 0.85rem; display: flex; justify-content: space-between; }
    .test-pass { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .test-fail { background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; }
  </style>
</head>
<body>
  <div class="test-suite">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
      <h2 style="font-size: 1.4rem;">Project 02: Gas Leakage Tests</h2>
      <a href="../index.html" class="btn btn-sm">Return to Dashboard</a>
    </div>
    <div id="results"></div>
  </div>

  <script src="../../../shared/js/utilities.js"></script>
  <script src="../../../shared/js/simulation-utils.js"></script>
  <script src="../../../shared/js/networking.js"></script>
  <script src="../config/config.js"></script>
  <script src="../js/simulation.js"></script>
  <script src="../js/hardware.js"></script>
  <script>
    const resultsContainer = document.getElementById('results');
    let passed = 0, failed = 0;

    function assert(name, condition, details = '') {
      const el = document.createElement('div');
      if (condition) {
        passed++;
        el.className = 'test-result test-pass';
        el.innerHTML = `<span>✓ ${name}</span><span>PASSED</span>`;
      } else {
        failed++;
        el.className = 'test-result test-fail';
        el.innerHTML = `<span>✗ ${name} (${details})</span><span>FAILED</span>`;
      }
      resultsContainer.appendChild(el);
    }

    assert('Config loaded with correct Project ID', window.GasLeakageConfig && window.GasLeakageConfig.projectId === 'gas-leakage-detector');
    assert('Alarm critical threshold set', window.GasLeakageConfig.thresholds.critical > window.GasLeakageConfig.thresholds.safeMax);

    const sim = new GasLeakageSimulation(window.GasLeakageConfig);
    sim.setScenario('safe');
    const safeStep = sim.generateStep('safe', 1);
    assert('Safe scenario returns low PPM and alarm inactive', safeStep.readings.alarmActive === false && safeStep.readings.gasPpm < 300);

    sim.setScenario('danger-leak');
    sim.setManualGas(950);
    const dangerStep = sim.generateStep('danger-leak', 2);
    assert('Danger leak scenario triggers alarm flag', dangerStep.readings.alarmActive === true);

    sim.setScenario('fault');
    const faultStep = sim.generateStep('fault', 3);
    assert('Fault scenario returns sensorStatus fault', faultStep.sensorStatus === 'fault');

    // Hardware parsing check
    let parsed = null;
    const hw = new GasLeakageHardware(window.GasLeakageConfig, (d) => { parsed = d; });
    hw.handleData({
      deviceId: 'esp8266-gas-01',
      projectId: 'gas-leakage-detector',
      timestamp: 1000,
      sensorStatus: 'ok',
      readings: { gasPpm: 850, alarmActive: true }
    });
    assert('Hardware adapter parses gas PPM and alarm active', parsed && parsed.readings.gasPpm === 850 && parsed.readings.alarmActive === true);

    const summary = document.createElement('div');
    summary.style.marginTop = '20px';
    summary.style.fontWeight = '700';
    summary.textContent = `Completed: ${passed} passed, ${failed} failed.`;
    resultsContainer.appendChild(summary);
  </script>
</body>
</html>
