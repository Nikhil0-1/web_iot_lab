<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unit Tests — Project 07 TDS Water Quality Monitor</title>
  <link rel="stylesheet" href="../../../shared/css/design-system.css">
  <style>
    body { padding: 30px; }
    .test-suite { max-width: 800px; margin: 0 auto; }
    .test-result { padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 8px; font-family: var(--font-mono); font-size: 0.85rem; display: flex; justify-content: space-between; }
    .test-pass { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .test-fail { background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; }
  </style>
</head>
<body>
  <div class="test-suite">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
      <h2 style="font-size: 1.4rem;">Project 07: TDS Quality Tests</h2>
      <a href="../index.html" class="btn btn-sm">Return to Dashboard</a>
    </div>
    <div id="results"></div>
  </div>

  <script src="../../../shared/js/utilities.js"></script>
  <script src="../../../shared/js/simulation-utils.js"></script>
  <script src="../../../shared/js/networking.js"></script>
  <script src="../config/config.js"></script>
  <script src="../js/simulation.js"></script>
  <script src="../js/hardware.js"></script>
  <script>
    const resultsContainer = document.getElementById('results');
    let passed = 0, failed = 0;

    function assert(name, condition, details = '') {
      const el = document.createElement('div');
      if (condition) {
        passed++;
        el.className = 'test-result test-pass';
        el.innerHTML = `<span>✓ ${name}</span><span>PASSED</span>`;
      } else {
        failed++;
        el.className = 'test-result test-fail';
        el.innerHTML = `<span>✗ ${name} (${details})</span><span>FAILED</span>`;
      }
      resultsContainer.appendChild(el);
    }

    assert('Config loaded with correct Project ID', window.TdsConfig && window.TdsConfig.projectId === 'tds-water-quality-monitor');
    assert('Purity threshold tiers correctly structured', window.TdsConfig.thresholds.drinkingMax > window.TdsConfig.thresholds.pureMax);

    const sim = new TdsSimulation(window.TdsConfig);
    sim.setScenario('pure');
    sim.setManualTds(35);
    const pureStep = sim.generateStep('pure', 1);
    assert('Pure scenario reports Pure RO Water tier', pureStep.readings.waterTier === 'Pure RO Water');

    sim.setScenario('contaminated');
    sim.setManualTds(820);
    const contStep = sim.generateStep('contaminated', 2);
    assert('Contaminated scenario reports Non-potable tier', contStep.readings.waterTier.includes('Non-potable') || contStep.readings.waterTier.includes('Poor'));

    sim.setScenario('fault');
    const faultStep = sim.generateStep('fault', 3);
    assert('Fault scenario returns sensorStatus fault', faultStep.sensorStatus === 'fault');

    // Hardware parsing check
    let parsed = null;
    const hw = new TdsHardware(window.TdsConfig, (d) => { parsed = d; });
    hw.handleData({
      deviceId: 'esp8266-tds-01',
      projectId: 'tds-water-quality-monitor',
      timestamp: 1000,
      sensorStatus: 'ok',
      readings: { tdsPpm: 180, voltage: 0.54, rawAdc: 167 }
    });
    assert('Hardware adapter parses TDS PPM and classifies Clean Drinking Water', parsed && parsed.readings.tdsPpm === 180 && parsed.readings.waterTier === 'Clean Drinking Water');

    const summary = document.createElement('div');
    summary.style.marginTop = '20px';
    summary.style.fontWeight = '700';
    summary.textContent = `Completed: ${passed} passed, ${failed} failed.`;
    resultsContainer.appendChild(summary);
  </script>
</body>
</html>
